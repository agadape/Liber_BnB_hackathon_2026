name: Verify project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
          NEXT_PUBLIC_CHAIN_ID: '97'
          NEXT_PUBLIC_USDC_ADDRESS: '0x2116D4a3f11Aa7059Ad0911ad5C89897CC0BcC97'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: liber_test
          POSTGRES_USER: liber
          POSTGRES_PASSWORD: liber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liber -d liber_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://liber:liber_test@localhost:5432/liber_test
      USDC_ADDRESS: '0x2116D4a3f11Aa7059Ad0911ad5C89897CC0BcC97'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.1.0 foundry-rs/forge-std
      - run: forge build
      - run: forge test

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed BNB app and API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            -D web.headers https://liber-bnb-web.vercel.app/ -o web.html
          echo 'Frontend HTTP response:'
          head -n 1 web.headers
          grep -q '<title>Liber</title>' web.html

          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            -H 'Origin: https://liber-bnb-web.vercel.app' \
            -D health.headers https://liber-bnb-api.vercel.app/health -o health.json
          echo 'API health HTTP response:'
          head -n 1 health.headers
          cat health.json
          grep -q '"status":"ok"' health.json
          grep -qi 'access-control-allow-origin: https://liber-bnb-web.vercel.app' health.headers

          status=$(curl --silent --show-error --retry 5 --retry-delay 3 \
            -o user.json -w '%{http_code}' \
            https://liber-bnb-api.vercel.app/users/by-address/0x0000000000000000000000000000000000000001)
          echo "Unknown user HTTP status: $status"
          cat user.json
          test "$status" = 404
          grep -q '"error":"user not found"' user.json

