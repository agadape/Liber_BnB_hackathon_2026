[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [{ access = "read", path = "../protocol/fixtures" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc = "${BSC_RPC_URL}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
